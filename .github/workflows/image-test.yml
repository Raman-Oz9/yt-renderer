name: Image source test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run comparison
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/image_test.py
      - name: Save results to image-test branch
        run: |
          cp -r image-test /tmp/image-test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan image-test
          git rm -rq --cached . || true
          git clean -fdxq || true
          cp -r /tmp/image-test/. .
          git add -A
          git commit -q -m "image test [skip ci]"
          git push -f origin image-test
