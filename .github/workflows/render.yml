name: Render video

on:
  workflow_dispatch:
    inputs:
      script:
        description: Narration script
        required: true
        type: string
      search_query:
        description: Pexels search query
        required: true
        type: string
      title:
        description: YouTube title
        required: true
        type: string
      description:
        description: YouTube description
        required: true
        type: string
      tags:
        description: Comma-separated tags
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts requests

      - name: Render video
        env:
          SCRIPT: ${{ inputs.script }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python render.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          TAG="video-${GITHUB_RUN_ID}"
          gh release create "$TAG" output/video.mp4 --title "$TITLE" --notes "$DESCRIPTION"
          # keep only the 20 newest releases
          gh release list --limit 200 --json tagName --jq '.[20:][].tagName' \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
