name: Render video

on:
  workflow_dispatch:
    inputs:
      script:
        description: Narration script
        required: true
        type: string
      search_query:
        description: One or more Pexels search phrases, "|"-separated, one per scene beat
        required: true
        type: string
      title:
        description: YouTube title
        required: true
        type: string
      description:
        description: YouTube description
        required: true
        type: string
      tags:
        description: Comma-separated tags
        required: false
        type: string
      publish:
        description: Publish a release (this triggers the YouTube upload). Set to false for test renders.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install edge-tts requests soundfile numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro huggingface_hub pillow

      - name: Render video
        env:
          SCRIPT: ${{ inputs.script }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          TITLE: ${{ inputs.title }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python render.py

      - name: Save stock-clip usage log
        if: ${{ inputs.publish != false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_clips_log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update stock-clip usage log [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi

      - name: Keep test render (no publish)
        if: ${{ inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/video.mp4
          retention-days: 3

      - name: Save test video to test-video branch
        if: ${{ inputs.publish == false }}
        run: |
          cp output/video.mp4 /tmp/test-video.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan test-video
          git rm -rq --cached . || true
          git clean -fdxq -e output || true
          cp /tmp/test-video.mp4 video.mp4
          git add video.mp4
          git commit -q -m "test render [skip ci]"
          git push -f origin test-video

      - name: Publish release
        if: ${{ inputs.publish != false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          TAG="video-${GITHUB_RUN_ID}"
          gh release create "$TAG" output/video.mp4 --title "$TITLE" --notes "$DESCRIPTION"
          # keep only the 20 newest releases
          gh release list --limit 200 --json tagName --jq '.[20:][].tagName' \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
