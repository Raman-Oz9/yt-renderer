name: TTS test (Kokoro)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet kokoro soundfile numpy
      - name: Generate samples
        run: |
          mkdir -p tts-test
          python - <<'PY' 2>&1 | tee tts-test/result.txt
          import time, soundfile as sf, numpy as np
          from kokoro import KPipeline
          text = ("Scientists once found a living animal that had been frozen for twenty four thousand years, and it simply woke up. "
                  "A tiny creature called a bdelloid rotifer was pulled from Siberian permafrost, thawed in a lab, and began to reproduce as if nothing had happened. "
                  "Think about that. While empires rose and fell, while humans learned to write, this animal sat in the dark, paused between one heartbeat and the next. "
                  "Its secret is a kind of molecular repair crew that mends broken DNA the moment the ice releases it. "
                  "So what else is lying frozen out there, waiting for the world to warm up?")
          t0=time.time(); pipe = KPipeline(lang_code='a'); print("load_s", round(time.time()-t0,1))
          for v in ["am_michael","am_adam","bm_george","bm_lewis"]:
              pipe_v = pipe if v.startswith("a") else KPipeline(lang_code='b')
              t0=time.time(); chunks=[a for _,_,a in pipe_v(text, voice=v, speed=0.95)]
              audio=np.concatenate(chunks); dur=len(audio)/24000
              sf.write(f"tts-test/{v}.wav", audio, 24000)
              print(v, "audio_s", round(dur,1), "gen_s", round(time.time()-t0,1))
          PY
          for f in tts-test/*.wav; do ffmpeg -y -loglevel error -i $f -b:a 128k ${f%.wav}.mp3; rm $f; done
          ls -la tts-test >> tts-test/result.txt
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tts-test; git commit -m "TTS samples [skip ci]" || true
          git pull -q --rebase origin main; git push
